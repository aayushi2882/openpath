<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="OpenPath - from curious beginner to confident contributor">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A0B0E"/><stop offset="1" stop-color="#14161B"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#D2F824"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#D2F824"/><stop offset="1" stop-color="#F59E0B"/>
  </linearGradient>
  <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#D2F824" stop-opacity="0.30"/><stop offset="1" stop-color="#D2F824" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#F59E0B" stop-opacity="0.26"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="typeclip"><rect x="80" y="236" width="0" height="44">
    <animate attributeName="width" dur="8.0s" repeatCount="indefinite" calcMode="linear"
      values="0;0;750;750;0" keyTimes="0;0.06;0.5;0.93;1"/>
  </rect></clipPath>
  <clipPath id="round"><rect width="1200" height="460" rx="22"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1200" height="460" fill="url(#bg)"/>
<rect width="1200" height="460" fill="url(#dots)"/>

<!-- ambient glows -->
<circle cx="260" cy="120" r="260" fill="url(#glowL)">
  <animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;40 20;0 0" dur="11s" repeatCount="indefinite"/>
</circle>
<circle cx="1010" cy="300" r="280" fill="url(#glowA)">
  <animate attributeName="opacity" values="1;0.5;1" dur="9s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" type="translate" values="0 0;-50 -20;0 0" dur="13s" repeatCount="indefinite"/>
</circle>

<circle cx="610" cy="60" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" begin="0.0s" repeatCount="indefinite"/></circle>
<circle cx="700" cy="110" r="1.8" fill="#fff"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
